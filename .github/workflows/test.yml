name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21']       # JDK used for TEST phase
        SERVER_VERSION: ['3.11', '4.0', '4.1', '5.0']  # Cassandra minor versions to test against

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Python for ccm ----
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install ccm
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 --single-branch -b cassandra-test https://github.com/apache/cassandra-ccm.git
          pip install -e ./cassandra-ccm

      # ---- Maven ----
      - name: Set up Maven 3.8.8
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.8.8'

      # ---- Install ALL required JDKs via setup-java and record their homes ----
      # JDK 8
      - name: Install Temurin 8 & record JAVA8_HOME
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Record JAVA8_HOME and set default JAVA_HOME
        run: |
          echo "JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      # JDK 11
      - name: Install Temurin 11 & record JAVA11_HOME
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Record JAVA11_HOME
        run: echo "JAVA11_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      # JDK 17
      - name: Install Temurin 17 & record JAVA17_HOME
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Record JAVA17_HOME
        run: echo "JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      # JDK 21
      - name: Install Temurin 21 & record JAVA21_HOME
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Record JAVA21_HOME
        run: echo "JAVA21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"

      # ---- Print env vars before build ----
      - name: Print environment
        run: printenv | sort

      # ---- Build once with Java 8 (skip tests) ----
      - name: Switch to Java 8 for build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build (Java 8, skip tests)
        run: mvn -B -V install -DskipTests -Dmaven.javadoc.skip=true

      # ---- Test using matrix JDK and SERVER_VERSION ----
      - name: Switch to Java ${{ matrix.java }} for tests
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Resolve Cassandra latest patch version
        id: cassandra
        env:
          SERVER_VERSION: ${{ matrix.SERVER_VERSION }}
        run: |
          PATCH_SERVER_VERSION=$(
            curl -s https://downloads.apache.org/cassandra/ \
            | grep -oP '(?<=href=")[0-9]+\.[0-9]+\.[0-9]+(?=)' \
            | sort -rV \
            | uniq -w 3 \
            | grep "^${SERVER_VERSION}\."
          )
          echo "Resolved Cassandra ${SERVER_VERSION}.x -> ${PATCH_SERVER_VERSION}"
          echo "PATCH_SERVER_VERSION=$PATCH_SERVER_VERSION" >> "$GITHUB_ENV"

      - name: Test (JDK ${{ matrix.java }}, Cassandra ${{ matrix.SERVER_VERSION }})
        env:
          TEST_JAVA_MAJOR_VERSION: ${{ matrix.java }}
        run: |
          echo "JAVA8_HOME=$JAVA8_HOME"
          echo "JAVA11_HOME=$JAVA11_HOME"
          echo "JAVA17_HOME=$JAVA17_HOME"
          echo "JAVA21_HOME=$JAVA21_HOME"
          echo "Active JAVA_HOME=$JAVA_HOME"
          echo "Resolved PATCH_SERVER_VERSION=$PATCH_SERVER_VERSION"

          mvn -B -V verify -T 1 \
            -Ptest-jdk-${TEST_JAVA_MAJOR_VERSION} \
            -DtestJavaHome="$JAVA_HOME" \
            -Dccm.version="${PATCH_SERVER_VERSION}" \
            -Dccm.dse=false \
            -Dmaven.test.failure.ignore=true \
            -Dmaven.javadoc.skip=true
      # ----- Collect CCM logs on failure -----
      - name: Zip CCM startup logs
        if: failure()
        run: |
          set -euxo pipefail
          mkdir -p ccm-logs
          shopt -s nullglob
          for f in "$HOME"/.ccm/*/*/logs/startup*; do
            dest="ccm-logs/${{ matrix.SERVER_VERSION }}-jdk${{ matrix.java }}-$(basename "$(dirname "$(dirname "$f")")")-$(basename "$(dirname "$f")")-$(basename "$f")"
            cp "$f" "$dest"
          done
          tar -czf ccm-startup-logs-${{ matrix.SERVER_VERSION }}-jdk${{ matrix.java }}.tar.gz ccm-logs || echo "No logs to tar"

      - name: Upload CCM startup logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ccm-startup-logs-${{ matrix.SERVER_VERSION }}-jdk${{ matrix.java }}
          path: |
            ccm-startup-logs-${{ matrix.SERVER_VERSION }}-jdk${{ matrix.java }}.tar.gz
            ccm-logs/**
          if-no-files-found: ignore

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          files: |
            test-results/**/*.xml
            test-results/**/*.trx
            test-results/**/*.json
