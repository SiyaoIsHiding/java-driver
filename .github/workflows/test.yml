name: Run Tests

on:
  push:
  pull_request:
  workflow_dispatch:   # allow manual trigger from Actions page

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17']                     # JDK used for TEST phase
        SERVER_VERSION: ['3.11', '4.0', '4.1', '5.0']  # Cassandra minor versions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Python for ccm ----
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install ccm
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 --single-branch -b cassandra-test https://github.com/apache/cassandra-ccm.git
          pip install -e ./cassandra-ccm

      # ---- Maven ----
      - name: Set up Maven 3.8.8
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.8.8'

      # ---- Install required Zulu JDKs (8/11/17) and capture their homes in one step ----
      - name: Install Zulu 8
        id: z8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'
          cache: maven   # enable Maven cache early
      - name: Install Zulu 11
        id: z11
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '11'
      - name: Install Zulu 17
        id: z17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Export JAVA*_HOME variables
        run: |
          echo "JAVA8_HOME=${{ steps.z8.outputs.path }}"  >> "$GITHUB_ENV"
          echo "JAVA11_HOME=${{ steps.z11.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA17_HOME=${{ steps.z17.outputs.path }}" >> "$GITHUB_ENV"
          echo "JAVA_HOME=${{ steps.z8.outputs.path }}"    >> "$GITHUB_ENV"

      # ---- Print env vars before build ----
      - name: Print environment
        run: printenv | sort

      # ---- Build once with Java 8 (skip tests) ----
      - name: Switch to Zulu 8 for build
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '8'
          cache: maven

      - name: Build (Java 8, skip tests)
        run: mvn -B -V install -DskipTests -Dmaven.javadoc.skip=true

      # ---- Test using matrix JDK and resolved latest patch for selected minor ----
      - name: Switch to Zulu ${{ matrix.java }} for tests
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Resolve Cassandra latest patch version
        id: cassandra
        env:
          SERVER_VERSION: ${{ matrix.SERVER_VERSION }}
        run: |
          PATCH_SERVER_VERSION=$(
            curl -s https://downloads.apache.org/cassandra/ \
            | grep -oP '(?<=href=")[0-9]+\.[0-9]+\.[0-9]+(?=)' \
            | sort -rV \
            | uniq -w 3 \
            | grep "^${SERVER_VERSION}\."
          )
          echo "Resolved Cassandra ${SERVER_VERSION}.x -> ${PATCH_SERVER_VERSION}"
          echo "PATCH_SERVER_VERSION=$PATCH_SERVER_VERSION" >> "$GITHUB_ENV"

      # ---- Start background watcher to COPY ALL node logs as soon as they appear ----
      - name: Start CCM log watcher
        env:
          SERVER_VERSION: ${{ matrix.SERVER_VERSION }}
          TEST_JAVA_MAJOR_VERSION: ${{ matrix.java }}
        run: |
          mkdir -p ccm-logs
          cat > watch_ccm_logs.sh <<'EOF'
          #!/usr/bin/env bash
          DEST="ccm-logs"
          SV="${SERVER_VERSION:-unknown}"
          J="${TEST_JAVA_MAJOR_VERSION:-unknown}"
          mkdir -p "$DEST"
          # Poll every 2s and copy any new files from ~/.ccm/*/*/logs/
          while true; do
            for f in "$HOME"/.ccm/*/*/logs/*; do
              [ -f "$f" ] || continue
              cluster="$(basename "$(dirname "$(dirname "$f")")")"
              node="$(basename "$(dirname "$f")")"
              base="$(basename "$f")"
              outdir="$DEST/${SV}-jdk${J}/${cluster}/${node}"
              mkdir -p "$outdir"
              if [ ! -f "$outdir/$base" ]; then
                cp "$f" "$outdir/$base" 2>/dev/null || true
                echo "copied: $f -> $outdir/$base" >> "$DEST/watcher.log"
              fi
            done
            sleep 2
          done
          EOF
          chmod +x watch_ccm_logs.sh
          ./watch_ccm_logs.sh &
          echo $! > watcher.pid

      - name: Run tests
        env:
          TEST_JAVA_MAJOR_VERSION: ${{ matrix.java }}
        run: |
          echo "JAVA8_HOME=$JAVA8_HOME"
          echo "JAVA11_HOME=$JAVA11_HOME"
          echo "JAVA17_HOME=$JAVA17_HOME"
          echo "Active JAVA_HOME=$JAVA_HOME"
          echo "Resolved PATCH_SERVER_VERSION=$PATCH_SERVER_VERSION"

          mvn -B -V verify -T 1 \
            -Ptest-jdk-${TEST_JAVA_MAJOR_VERSION} \
            -DtestJavaHome="$JAVA_HOME" \
            -Dccm.version="${PATCH_SERVER_VERSION}" \
            -Dccm.dse=false \
            -Dmaven.javadoc.skip=true \
            -Dsurefire.reportFormat=xml \
            -Dsurefire.useFile=true

      # Always stop the background watcher and show what we captured
      - name: Stop CCM log watcher
        if: always()
        run: |
          if [ -f watcher.pid ]; then
            kill "$(cat watcher.pid)" 2>/dev/null || true
            rm -f watcher.pid
          fi
          echo "== Watcher log =="
          [ -f ccm-logs/watcher.log ] && tail -n +1 ccm-logs/watcher.log || echo "no watcher.log"
          echo "== Collected files =="
          [ -d ccm-logs ] && find ccm-logs -type f -maxdepth 4 -print || echo "no ccm-logs dir"

      # Publish results (skip on forked PRs to avoid 403 on check-runs)
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          files: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          comment_mode: off
          check_name: "Test Results (Cassandra ${{ matrix.SERVER_VERSION }}, JDK ${{ matrix.java }})"

      # ----- Upload CCM logs on failure (no tar) -----
      - name: Upload CCM startup logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ccm-node-logs-${{ matrix.SERVER_VERSION }}-jdk${{ matrix.java }}
          path: |
            ccm-logs/**
          if-no-files-found: warn
