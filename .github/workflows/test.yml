name: Run tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21']  # test JDKs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Python for ccm
      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install ccm
        run: |
          python -m pip install --upgrade pip
          git clone --depth 1 --single-branch -b cassandra-test https://github.com/apache/cassandra-ccm.git
          pip install -e ./cassandra-ccm

      - name: Set up Maven 3.8.8
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.8.8'
          
      # Build once with Java 8 (skip tests)
      - name: Set up Java 8 (Temurin) + Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build (Java 8, skip tests)
        run: mvn -B -V install -DskipTests -Dmaven.javadoc.skip=true

      # Now switch to the matrix JDK for tests
      - name: Set up Java ${{ matrix.java }} 
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Test (Java ${{ matrix.java }})
        env:
          TEST_JAVA_MAJOR_VERSION: ${{ matrix.java }}
        run: |
          # actions/setup-java sets JAVA_HOME for the active JDK
          echo "Using JAVA_HOME=$JAVA_HOME"
          mvn -B -V verify -T 1 \
            -Ptest-jdk-${TEST_JAVA_MAJOR_VERSION} \
            -DtestJavaHome="$JAVA_HOME" \
            -Dccm.dse=false \
            -Dmaven.test.failure.ignore=true \
            -Dmaven.javadoc.skip=true
